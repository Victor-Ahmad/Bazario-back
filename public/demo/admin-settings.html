<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Platform Settings</title>
        <link rel="stylesheet" href="./assets/css/app.css" />
    </head>
    <body>
        <div id="appHeader"></div>
        <script type="module" src="./assets/js/header.js"></script>

        <main class="page">
            <section class="right">
                <div class="card" style="display: grid; gap: 16px">
                    <div>
                        <h1 id="pageTitle" style="margin: 0 0 6px">Platform Settings</h1>
                        <p id="pageSubtitle" class="subtitle" style="max-width: none">
                            Configure platform fee and promotion pricing used by the marketplace.
                        </p>
                    </div>

                    <form id="settingsForm" style="display: grid; gap: 14px">
                        <div style="display: grid; gap: 8px">
                            <label for="platform_fee_percent" id="labelPlatformFee">Platform fee (%)</label>
                            <input id="platform_fee_percent" name="platform_fee_percent" type="number" min="0" max="100" step="0.01" />
                        </div>

                        <div style="display: grid; gap: 8px">
                            <label for="announcement_price_per_day" id="labelAnnouncementPrice">Announcement price per day</label>
                            <input id="announcement_price_per_day" name="announcement_price_per_day" type="number" min="0" step="0.01" />
                        </div>

                        <div style="display: grid; gap: 8px">
                            <label for="ad_price_per_day_golden_ad" id="labelGoldPrice">Gold ad price per day</label>
                            <input id="ad_price_per_day_golden_ad" name="ad_price_per_day_golden_ad" type="number" min="0" step="0.01" />
                        </div>

                        <div style="display: grid; gap: 8px">
                            <label for="ad_price_per_day_silver_ad" id="labelSilverPrice">Silver ad price per day</label>
                            <input id="ad_price_per_day_silver_ad" name="ad_price_per_day_silver_ad" type="number" min="0" step="0.01" />
                        </div>

                        <div style="display: grid; gap: 8px">
                            <label for="ad_price_per_day_normal_ad" id="labelNormalPrice">Standard ad price per day</label>
                            <input id="ad_price_per_day_normal_ad" name="ad_price_per_day_normal_ad" type="number" min="0" step="0.01" />
                        </div>

                        <div style="display: flex; gap: 10px; flex-wrap: wrap">
                            <button id="saveBtn" type="submit">Save settings</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="left">
                <div class="brand">
                    <div class="toolbar">
                        <div id="badgeText" class="badge">Marketplace Demo</div>

                        <div class="langWrap">
                            <label class="srOnly" for="langSelect">Language</label>
                            <select id="langSelect" aria-label="Language">
                                <option value="en">English</option>
                                <option value="ar">Arabic</option>
                                <option value="de">German</option>
                            </select>
                        </div>
                    </div>
                </div>

                <section class="status">
                    <div class="statusHeader">
                        <h2 id="statusTitle">Status</h2>
                        <span id="statusPill" class="pill">
                            <span class="code">—</span>
                            <span class="label">Not sent</span>
                        </span>
                    </div>

                    <div id="statusMeta" class="statusMeta">
                        <code>GET</code>
                        <code>/api/admin/settings</code>
                    </div>

                    <div id="statusBox" class="statusBox">Ready.</div>
                    <pre id="debugBox" class="debugBox" style="display: none"></pre>
                </section>
            </section>
        </main>

        <script type="module" src="./assets/js/admin-settings.js"></script>
    </body>
</html>
